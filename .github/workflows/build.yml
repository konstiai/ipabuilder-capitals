name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APPDIR="build/Capitals.app"
          mkdir -p "$APPDIR"
          if [ -n "$(find src -name '*.swift' | head -1)" ]; then
            find src -name '*.swift' -print0 | xargs -0 xcrun swiftc -sdk "$SDK" -target arm64-apple-ios15.0 -parse-as-library -O -module-name Capitals -o "$APPDIR/Capitals"
          else
            find src \( -name '*.m' -o -name '*.mm' -o -name '*.c' -o -name '*.cpp' \) -print0 | xargs -0 xcrun clang -isysroot "$SDK" -arch arm64 -miphoneos-version-min=15.0 -fobjc-arc -framework UIKit -framework Foundation -lc++ -o "$APPDIR/Capitals"
          fi
      - name: Sign (ldid)
        run: |
          brew install ldid || true
          ldid -S "build/Capitals.app/Capitals" || echo "ldid skipped"
      - name: Package IPA
        run: |
          APPDIR="build/Capitals.app"
          cp Info.plist "$APPDIR/Info.plist"
          if [ -d _icons ]; then cp _icons/*.png "$APPDIR/"; fi
          mkdir Payload
          cp -r "$APPDIR" Payload/
          zip -qr "Capitals.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: Capitals.ipa
